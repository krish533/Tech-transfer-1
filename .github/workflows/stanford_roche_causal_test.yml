name: Stanford-Roche causal validation

on:
  push:
    branches:
      - causal-stanford-roche-test
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  causal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels rapidfuzz openpyxl

      - name: Run assignment-language analysis
        working-directory: P1_replication_package
        run: python paper_outputs/code/run_stanford_roche_causal_test.py

      - name: Run exploratory federal R&D exposure analysis
        working-directory: P1_replication_package
        run: python paper_outputs/code/run_federal_rd_exposure_analysis.py

      - name: Run audited federal R&D exposure analysis
        working-directory: P1_replication_package
        run: python paper_outputs/code/run_federal_rd_exposure_clean.py

      - name: Run extended adoption and exposure analysis
        working-directory: P1_replication_package
        run: python paper_outputs/code/run_stanford_roche_extended.py

      - name: Save NCSES source universe
        working-directory: P1_replication_package
        run: python paper_outputs/code/dump_ncses_universe.py

      - name: Upload causal-analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: stanford-roche-causal-results
          path: |
            P1_replication_package/paper_outputs/tables/stanford_roche_causal/
            P1_replication_package/paper_outputs/tables/federal_rd_exposure/
            P1_replication_package/paper_outputs/tables/federal_rd_exposure_clean/
            P1_replication_package/paper_outputs/tables/stanford_roche_extended/
          if-no-files-found: error
